version: "3"

tasks:
  gen:
    desc: "Generate Go code from proto files"
    cmds:
      - |
        protoc \
          -I proto \
          proto/sso/v1/*.proto \
          proto/seller/v1/*.proto \
          --go_out=./gen/go \
          --go_opt=paths=source_relative \
          --go-grpc_out=./gen/go \
          --go-grpc_opt=paths=source_relative