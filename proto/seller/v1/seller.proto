syntax = "proto3";

package seller.v1;

option go_package = "github.com/barnigator/protos/gen/go/seller/v1;sellerv1";

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

service SellerService {
  rpc CreateSeller (CreateSellerRequest) returns (SellerResponse);
  rpc GetSeller (GetSellerRequest) returns (SellerResponse);
  rpc ListSellersByUserID (ListSellersByUserIDRequest) returns (ListSellersResponse);
  rpc UpdateSeller (UpdateSellerRequest) returns (SellerResponse);
  rpc GetSellerStatus (GetSellerStatusRequest) returns (GetSellerStatusResponse);
  rpc ArchiveSeller (ArchiveSellerRequest) returns (google.protobuf.Empty);
  rpc DeleteSeller (DeleteSellerRequest) returns (google.protobuf.Empty);

  rpc AddSocialLink (AddSocialLinkRequest) returns (SocialLinkResponse);
  rpc ListSocialLinks (ListSocialLinksRequest) returns (ListSocialLinksResponse);
  rpc UpdateSocialLink (UpdateSocialLinkRequest) returns (SocialLinkResponse);
  rpc DeleteSocialLink (DeleteSocialLinkRequest) returns (google.protobuf.Empty);
}

enum SellerStatus {
  SELLER_STATUS_UNSPECIFIED = 0;
  SELLER_STATUS_PENDING = 1;
  SELLER_STATUS_ACTIVE = 2;
  SELLER_STATUS_REJECTED = 3;
  SELLER_STATUS_BLOCKED = 4;
  SELLER_STATUS_ARCHIVED = 5;
}

message Seller {
  string id = 1;
  string user_id = 2;
  string brand_name = 3;
  string description = 4;
  SellerStatus status = 5;
}

message SellerResponse {
  Seller seller = 1;
}

message GetSellerStatusRequest {
  string seller_id = 1;
}

message GetSellerStatusResponse {
  SellerStatus status = 1;
}

message CreateSellerRequest {
  string user_id = 1;
  string brand_name = 2;
  string description = 3;
}

message GetSellerRequest {
  string seller_id = 1;
}

message ListSellersByUserIDRequest {
  string user_id = 1;
}

message ListSellersResponse {
  repeated Seller sellers = 1;
}

message UpdateSellerRequest {
  string seller_id = 1;
  string brand_name = 2;
  string description = 3;
  google.protobuf.FieldMask update_mask = 4;
}


message ArchiveSellerRequest {
  string seller_id = 1;
}

message DeleteSellerRequest {
  string seller_id = 1;
}

enum SocialLinkType {
  SOCIAL_LINK_TYPE_UNSPECIFIED = 0;
  SOCIAL_LINK_TYPE_TELEGRAM = 1;
  SOCIAL_LINK_TYPE_VK = 2;
  SOCIAL_LINK_TYPE_INSTAGRAM = 3;
  SOCIAL_LINK_TYPE_WEBSITE = 4;
  SOCIAL_LINK_TYPE_WHATSAPP = 5;
  SOCIAL_LINK_TYPE_YOUTUBE = 6;
  SOCIAL_LINK_TYPE_FACEBOOK = 7;
  SOCIAL_LINK_TYPE_OZON = 8;
  SOCIAL_LINK_TYPE_WILDBERRIES = 9;
  SOCIAL_LINK_TYPE_YANDEX_MARKET = 10;
  SOCIAL_LINK_TYPE_AVITO = 11;
}

message SocialLink {
  string id = 1;
  string seller_id = 2;
  SocialLinkType type = 3;
  string url = 4;
}

message SocialLinkResponse {
  SocialLink link = 1;
}

message ListSocialLinksRequest {
  string seller_id = 1;
}

message ListSocialLinksResponse {
  repeated SocialLink link = 1;
}

message AddSocialLinkRequest {
  string seller_id = 1;
  SocialLinkType type = 2;
  string url = 3;
}

message UpdateSocialLinkRequest {
  string link_id = 1;
  SocialLinkType type = 2;
  string url = 3;
  google.protobuf.FieldMask update_mask = 4;
}

message DeleteSocialLinkRequest {
  string link_id = 1;
}